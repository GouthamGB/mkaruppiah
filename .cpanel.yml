---
deployment:
  tasks:
    - for version in 22 20 18 16; do if [ -x /opt/cpanel/ea-nodejs$version/bin/npm ]; then export PATH=/opt/cpanel/ea-nodejs$version/bin:$PATH; break; fi; done
    - command -v npm || { echo "No cPanel Node.js/npm installation found"; exit 1; }
    - cd /home/mkaruppiah/mkaruppiah-next
    - npm install
    - npm run build
    - mkdir -p tmp
    - touch tmp/restart.txt
